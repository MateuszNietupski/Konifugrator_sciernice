      <h2>Interaktywny Dobór i Charakterystyka Ściernic</h2>
      <p>Aplikacja umożliwia techniczny dobór tarcz szlifierskich, ściernic płaskich, garnkowych, talerzykowych oraz ściernic supertwardych (diament i borazon/CBN) według standardów FEPA i ISO.</p>
      <h3>Jak dobrać ściernicę?</h3>
      <ul>
        <li><strong>Kształt i typ:</strong> Typ 1 (płaska), Typ 11 (doniczkowa), Typ 12 (talerzykowa), Typ 27 i inne.</li>
        <li><strong>Rodzaj ścierniwa:</strong> Elektrokorund (95A, 99A, CrA), Węglik krzemu (99C), Diament, CBN.</li>
        <li><strong>Wymiary główne:</strong> Średnica zewnętrzna (D), grubość/szerokość (T), średnica otworu (H).</li>
      </ul>
      <p>Włącz obsługę JavaScript w przeglądarce, aby uruchomić pełny konfigurator z dynamicznym filtrowaniem produktów.</p>
